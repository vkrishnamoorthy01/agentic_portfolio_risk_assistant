# Render Blueprint for the HTTP service (free tier: 0.1 CPU, 512 MB RAM;
# sleeps after 15 minutes idle, about a minute to wake on the next request).
# Render builds the Dockerfile. Market prices aren't in the repo: upload
# prices_<source>.csv and .json as secret files (Environment > Secret Files);
# they appear in /etc/secrets. Without them the service uses synthetic prices.
services:
  - type: web
    name: portfolio-risk-service
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploy a new commit on main only after its GitHub checks (the tests
    # workflow, including the Docker smoke test) have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: PRICE_DATA_DIR
        value: /etc/secrets
